<!DOCTYPE html>
<html lang="ru" data-theme="amoled">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniPure — Тестовый стенд 720p -> Full HD/2K</title>
  <link rel="stylesheet" href="../src/content/content.css">
  <style>
    :root {
      --bg: #000000;
      --surface: #0b0b0d;
      --border: #222228;
      --text: #f2f3f5;
      --muted: #8e929b;
      --accent: #3b82f6;
    }
    html[data-theme="light"] {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --border: #dfe2e8;
      --text: #111318;
      --muted: #5a616e;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .bar h1 { font-size: 15px; font-weight: 600; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    select, button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12.5px;
      cursor: pointer;
    }
    button.active {
      background: rgba(59, 130, 246, 0.16);
      border-color: var(--accent);
    }
    .player-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #050507;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    .stats {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <div>
        <h1>AniPure — Локальный тестовый стенд (источник 1280x720, 24 FPS)</h1>
        <div class="stats" id="demoStats">Инициализация потока...</div>
      </div>
      <div class="controls">
        <select id="demoTier">
          <option value="fast">Быстро</option>
          <option value="balanced" selected>Баланс</option>
          <option value="quality">Качество</option>
          <option value="ultra">Ультра</option>
        </select>
        <select id="demoMode">
          <option value="mode_gan" selected>GAN Максимум (4K детали)</option>
          <option value="mode_bb">Чёткое аниме (B+B, CNN VL)</option>
          <option value="mode_aa">Максимум контуров (A+A)</option>
          <option value="mode_clean">Очистка сжатия и шума</option>
          <option value="mode_lite">Лёгкая нейросеть (ноутбук)</option>
          <option value="eco_fast">Экономный без нейросети</option>
        </select>
        <select id="demoInterp">
          <option value="off">24 FPS (ориг.)</option>
          <option value="48">48 FPS (Flow)</option>
          <option value="60">60 FPS (Flow)</option>
        </select>
        <button type="button" id="demoSplit">До / После</button>
        <button type="button" id="demoHud">HUD</button>
        <button type="button" id="demoTheme">Светлая тема</button>
      </div>
    </div>

    <div class="player-stage" id="playerStage">
      <video id="testVideo" muted playsinline autoplay></video>
    </div>
  </div>

  <script src="../src/shared/i18n.js"></script>
  <script src="../src/shared/config.js"></script>
  <script src="../src/shared/shaders.js"></script>
  <script src="../src/shaders/anime4k-models.js"></script>
  <script src="../src/engine/cnn-runner.js"></script>
  <script src="../src/engine/webgl-pipeline.js"></script>
  <script src="../src/content/content.js"></script>
  <script>
    (function () {
      // Synthetic 720p 24 FPS cel-shaded anime stream (soft edges + gradients + motion)
      const srcCanvas = document.createElement('canvas');
      srcCanvas.width = 1280;
      srcCanvas.height = 720;
      const ctx = srcCanvas.getContext('2d');
      let frame = 0;

      function drawAnimeFrame() {
        frame++;
        const t = frame / 24;

        // Limited-RGB style slightly washed anime sky with stepped banding
        for (let b = 0; b < 24; b++) {
          const y0 = (b / 24) * 420;
          const y1 = ((b + 1) / 24) * 420;
          const r = Math.round(46 + b * 5.2);
          const g = Math.round(78 + b * 5.5);
          const bl = Math.round(126 + b * 3.8);
          ctx.fillStyle = `rgb(${r},${g},${bl})`;
          ctx.fillRect(0, y0, 1280, y1 - y0 + 1);
        }

        // Moving clouds
        const cloudX = ((t * 55) % 1500) - 200;
        ctx.fillStyle = '#dfe2e6';
        ctx.beginPath();
        ctx.arc(cloudX, 170, 62, 0, Math.PI * 2);
        ctx.arc(cloudX + 58, 155, 76, 0, Math.PI * 2);
        ctx.arc(cloudX + 125, 175, 55, 0, Math.PI * 2);
        ctx.fill();

        // City horizon & ground
        ctx.fillStyle = '#333b4a';
        ctx.fillRect(0, 420, 1280, 300);

        // Moving anime train with dark outlines (great test for CAS, line thinning & optical flow!)
        const trainX = ((t * 180) % 1680) - 340;
        ctx.save();
        ctx.filter = 'blur(0.7px)'; // Simulate soft 720p web compression
        ctx.fillStyle = '#e8ecf2';
        ctx.strokeStyle = '#1b1d24';
        ctx.lineWidth = 4;
        ctx.fillRect(trainX, 340, 310, 92);
        ctx.strokeRect(trainX, 340, 310, 92);
        ctx.fillStyle = '#4876b8';
        ctx.fillRect(trainX, 396, 310, 18);
        for (let i = 0; i < 4; i++) {
          ctx.fillStyle = '#263042';
          ctx.fillRect(trainX + 20 + i * 70, 356, 52, 30);
          ctx.strokeRect(trainX + 20 + i * 70, 356, 52, 30);
        }

        // Foreground utility poles & wires (sharp diagonal lines)
        ctx.lineWidth = 3;
        for (let p = 0; p < 5; p++) {
          const px = 140 + p * 260;
          ctx.beginPath();
          ctx.moveTo(px, 210);
          ctx.lineTo(px, 720);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(0, 235);
        ctx.quadraticCurveTo(640, 295, 1280, 235);
        ctx.stroke();
        ctx.restore();

        // On-screen text sample
        ctx.save();
        ctx.font = 'bold 34px "Segoe UI", Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#0a0b0e';
        ctx.fillStyle = '#ffffff';
        ctx.strokeText('Не сдавайся, даже если впереди тьма!', 640, 650);
        ctx.fillText('Не сдавайся, даже если впереди тьма!', 640, 650);
        ctx.restore();
      }

      drawAnimeFrame();
      setInterval(drawAnimeFrame, 1000 / 24);

      const video = document.getElementById('testVideo');
      video.srcObject = srcCanvas.captureStream(24);
      video.play().catch(() => {});

      const getApi = () => window.AniPureContentApi || window.LumaScaleContentApi;

      const syncDemoControls = () => {
        const api = getApi();
        if (!api) return;
        const cur = api.getSettings();
        api.applySettings({
          ...cur,
          enabled: true,
          tier: document.getElementById('demoTier').value,
          mode: document.getElementById('demoMode').value,
          interpolation: document.getElementById('demoInterp').value,
          splitScreen: document.getElementById('demoSplit').classList.contains('active'),
          showHud: document.getElementById('demoHud').classList.contains('active')
        });
      };

      ['demoTier', 'demoMode', 'demoInterp'].forEach(id => {
        document.getElementById(id).addEventListener('change', syncDemoControls);
      });
      ['demoSplit', 'demoHud'].forEach(id => {
        document.getElementById(id).addEventListener('click', (e) => {
          e.currentTarget.classList.toggle('active');
          syncDemoControls();
        });
      });
      document.getElementById('demoTheme').addEventListener('click', (e) => {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur === 'amoled' ? 'light' : 'amoled';
        document.documentElement.setAttribute('data-theme', next);
        e.currentTarget.textContent = next === 'amoled' ? 'Светлая тема' : 'AMOLED тема';
      });

      setTimeout(() => {
        const api = getApi();
        if (api) {
          api.rescan();
          document.getElementById('demoSplit').classList.add('active');
          document.getElementById('demoHud').classList.add('active');
          syncDemoControls();
        }
      }, 300);

      setInterval(() => {
        const api = getApi();
        if (!api) return;
        const t = api.getTelemetry();
        if (t) {
          document.getElementById('demoStats').textContent =
            `${t.srcWidth}x${t.srcHeight} -> ${t.outWidth}x${t.outHeight} | ${t.renderMs} мс | ${t.outputFps} FPS | GPU: ${t.gpuRenderer}`;
        }
      }, 600);
    })();
  </script>
</body>
</html>
